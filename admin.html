<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SkillHub Admin</title>
  <style>
    :root{--ink:#0f172a;--muted:#64748b;--glass:rgba(255,255,255,.68);--line:rgba(255,255,255,.62);--panel:rgba(255,255,255,.52);--deep:#07111f;--accent:#635bff;--cyan:#7dd3fc;--ok:#16a34a;--red:#ef4444}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 8%,#263b8f 0,#0b1224 32%,transparent 33%),radial-gradient(circle at 88% 4%,rgba(125,211,252,.34),transparent 28%),radial-gradient(circle at 50% 100%,rgba(199,210,254,.18),transparent 36%),linear-gradient(135deg,#08111f,#111827 45%,#172554);overflow-x:hidden}.app{display:grid;grid-template-columns:260px 1fr;gap:18px;min-height:100vh;padding:18px}.side{position:sticky;top:18px;height:calc(100vh - 36px);display:flex;flex-direction:column;padding:18px;border:1px solid rgba(255,255,255,.14);border-radius:30px;background:rgba(8,15,32,.72);backdrop-filter:blur(28px) saturate(150%);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 28px 90px rgba(0,0,0,.24);color:white}.brand{display:flex;align-items:center;gap:10px;margin:8px 4px 26px}.brand i{width:32px;height:32px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--cyan));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 12px 32px rgba(99,102,241,.42)}.brand b{font-size:18px}.nav{display:grid;gap:8px}.nav button{width:100%;border:1px solid transparent;border-radius:17px;padding:13px 14px;background:transparent;color:#cbd5e1;text-align:left;cursor:pointer;font-weight:700;transition:.18s}.nav button:hover{background:rgba(255,255,255,.08);transform:translateX(2px)}.nav button.active{background:linear-gradient(135deg,rgba(99,102,241,.34),rgba(125,211,252,.12));border-color:rgba(255,255,255,.12);color:white;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}.user{margin-top:auto;border-radius:18px;background:rgba(255,255,255,.08);padding:14px;color:#e2e8f0}.main{min-width:0;border:1px solid var(--line);border-radius:34px;background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(239,246,255,.72));backdrop-filter:blur(28px) saturate(155%);box-shadow:0 30px 100px rgba(0,0,0,.28);padding:24px;overflow:hidden}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.top h1{margin:0;font-size:30px;letter-spacing:-.8px}.top p{margin:7px 0 0;color:var(--muted);line-height:1.65}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid rgba(255,255,255,.72);border-radius:15px;padding:10px 14px;background:rgba(255,255,255,.62);color:#111827;text-decoration:none;cursor:pointer;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.75)}.btn.primary{border:0;background:linear-gradient(135deg,#111827,#334155);color:white;box-shadow:0 14px 34px rgba(15,23,42,.24)}.btn.danger{color:var(--red)}.btn.ghost{background:transparent;color:#64748b;box-shadow:none}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric,.panel,.preview,.notice{position:relative;border:1px solid rgba(255,255,255,.68);border-radius:26px;background:var(--panel);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 18px 60px rgba(51,65,85,.10);overflow:hidden}.metric:after,.panel:after,.preview:after{content:"";position:absolute;inset:1px;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.6),transparent 38%,rgba(255,255,255,.2));pointer-events:none}.metric{padding:18px}.metric span,.label{color:var(--muted);font-size:13px;font-weight:700}.metric b{display:block;font-size:32px;margin-top:8px}.work{display:grid;grid-template-columns:1.03fr 1.28fr .9fr;gap:16px;align-items:start}.panel,.preview{padding:18px}.panel>* ,.preview>* ,.metric>*{position:relative;z-index:1}.panel h2,.preview h2{font-size:18px;margin:0 0 14px}.toolbar{display:grid;grid-template-columns:1fr 132px;gap:10px;margin-bottom:12px}input,select,textarea{width:100%;border:1px solid rgba(148,163,184,.35);border-radius:15px;padding:12px 13px;background:rgba(255,255,255,.72);color:#0f172a;outline:none}textarea{min-height:80px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:rgba(99,102,241,.45);box-shadow:0 0 0 4px rgba(99,102,241,.1)}.list{display:grid;gap:8px;max-height:640px;overflow:auto;padding-right:2px}.row{border:1px solid rgba(255,255,255,.58);background:rgba(255,255,255,.42);border-radius:17px;padding:12px;cursor:pointer}.row.active{background:#eef2ff;border-color:#818cf8}.row strong{display:block}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;color:#64748b;font-size:12px}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;background:#fff;border:1px solid rgba(148,163,184,.25)}.pill.on{background:#dcfce7;color:#166534}.pill.off{background:#fee2e2;color:#991b1b}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{font-size:13px;color:#475569;font-weight:800}.form .full{grid-column:1/-1}.checks{display:flex;gap:18px;align-items:center}.checks label{display:flex;align-items:center;gap:8px}.card-preview{border:1px solid rgba(255,255,255,.72);border-radius:28px;background:rgba(255,255,255,.52);padding:22px;min-height:270px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 24px 80px rgba(51,65,85,.12)}.card-preview .num{color:#94a3b8;font-size:13px;margin-bottom:18px}.card-preview span{display:inline-block;margin-bottom:14px;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.8);font-size:13px}.card-preview h3{margin:0 0 10px}.card-preview p{color:#64748b;line-height:1.7}.fit{font-size:13px;color:#475569;background:rgba(255,255,255,.5);border-radius:16px;padding:10px}.mockbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.mockbtns i{font-style:normal;border-radius:13px;padding:9px 11px;background:#fff;border:1px solid #e2e8f0;font-size:13px}.mockbtns i:first-child{background:#111827;color:white}.note,.notice{padding:16px;color:#64748b;font-size:13px;line-height:1.7}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid rgba(148,163,184,.2);text-align:left}.table th{color:#64748b;font-size:13px}.bar{height:10px;border-radius:999px;background:#e2e8f0;overflow:hidden}.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--cyan))}.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.cat-card{border:1px solid rgba(255,255,255,.68);border-radius:24px;background:rgba(255,255,255,.48);padding:18px}.cat-card b{font-size:20px}.cat-card p{margin:8px 0 0;color:#64748b}.empty{padding:28px;text-align:center;color:#64748b;font-weight:800}.toast{position:fixed;right:24px;bottom:24px;z-index:40;opacity:0;transform:translateY(10px);transition:.2s;border-radius:18px;padding:12px 16px;background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.8);backdrop-filter:blur(20px);box-shadow:0 20px 70px rgba(0,0,0,.25);font-weight:800}.toast.show{opacity:1;transform:translateY(0)}
    @media(max-width:1180px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.nav{grid-template-columns:repeat(5,1fr)}.work,.grid4,.cat-grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand"><i></i><b>SkillHub Admin</b></div>
      <nav class="nav" id="nav">
        <button class="active" data-view="dashboard" type="button">总览 Dashboard</button>
        <button data-view="skills" type="button">技能管理</button>
        <button data-view="categories" type="button">分类管理</button>
        <button data-view="stats" type="button">数据统计</button>
        <button data-view="settings" type="button">系统设置</button>
      </nav>
      <div class="user">👤 Admin<br><small>管理员 · 本地安全版</small></div>
    </aside>
    <main class="main" id="main"><section class="notice">后台正在启动。如果这里一直不动，请刷新页面。</section></main>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    var fallbackSkills=[{id:'ux-pro-max',name:'UX Pro Max',category:'前端',tagZh:'前端审美',tagEn:'UI/UX',featured:true,enabled:true,path:'ui-ux-pro-max.txt',github:'https://github.com/nextlevelbuilder/ui-ux-pro-max-skill',descriptionZh:'用于配色、字体、布局、间距、组件层级，把页面从普通提升到高级。',descriptionEn:'Color, typography, spacing, layout and UI quality guidance.',fitZh:'网页美化、视觉升级、UI 规范',fitEn:'UI polish, visual upgrade, design system',sort:1},{id:'smart-summarize',name:'Smart Summarize',category:'总结',tagZh:'总结',tagEn:'Summary',featured:false,enabled:true,path:'sum.txt',github:'https://github.com/VanessaPellegrini/skills',descriptionZh:'自动判断内容类型，选择合适的总结方法。',descriptionEn:'Auto-selects the right summarization method.',fitZh:'文章总结、会议纪要、论文提炼',fitEn:'Articles, meetings, papers',sort:2}];
    var skills=fallbackSkills.slice(),current=0,view='dashboard',sourceState='正在读取 skills.json';
    function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
    function toast(t){var el=document.getElementById('toast');el.textContent=t;el.className='toast show';setTimeout(function(){el.className='toast'},1800)}
    function selected(){return skills[current]||skills[0]}
    function counts(){var cats={};skills.forEach(function(s){cats[s.category]=(cats[s.category]||0)+1});return {total:skills.length,hot:skills.filter(function(s){return s.featured}).length,on:skills.filter(function(s){return s.enabled!==false}).length,cats:cats}}
    function top(title,desc){return '<section class="top"><div><h1>'+title+'</h1><p>'+desc+'</p><p class="label">数据状态：'+esc(sourceState)+'</p></div><div class="actions"><a class="btn" href="index.html">打开前台</a><button class="btn" id="saveDraft" type="button">保存草稿</button><button class="btn" id="copyJson" type="button">复制 JSON</button><button class="btn primary" id="downloadJson" type="button">导出 skills.json</button></div></section>'}
    function metric(label,value){return '<div class="metric"><span>'+label+'</span><b>'+value+'</b></div>'}
    function statsCards(){var c=counts(),n=Object.keys(c.cats).length;return '<section class="grid4">'+metric('技能总数',c.total)+metric('精选技能',c.hot)+metric('分类数量',n)+metric('已启用',c.on)+'</section>'}
    function dashboard(){var recent=skills.slice().sort(function(a,b){return (a.sort||0)-(b.sort||0)}).slice(0,6).map(function(s){return '<tr><td>'+esc(s.name)+'</td><td>'+esc(s.category)+'</td><td><span class="pill '+(s.enabled!==false?'on':'off')+'">'+(s.enabled!==false?'已启用':'已停用')+'</span></td><td>'+esc(s.sort)+'</td></tr>'}).join('');return top('管理后台 · 总览','查看 Skill 库状态，快速进入编辑、分类、统计和发布准备。')+statsCards()+'<section class="work" style="grid-template-columns:1.2fr .8fr;margin-top:16px"><div class="panel"><h2>最近 Skill</h2><table class="table"><thead><tr><th>名称</th><th>分类</th><th>状态</th><th>排序</th></tr></thead><tbody>'+recent+'</tbody></table></div><div class="panel"><h2>前后端连接说明</h2><p class="note">前台已经读取 skills.json。后台现在可以编辑并导出 skills.json，但还不能直接写回 GitHub。要实现“后台保存后前台自动变”，下一步需要新增 /api/save-skills 服务端接口。</p><button class="btn primary" data-go="skills" type="button">进入技能管理</button></div></section>'}
    function renderList(){var kw=document.getElementById('kw')?document.getElementById('kw').value.toLowerCase():'',cat=document.getElementById('cat')?document.getElementById('cat').value:'全部';var html='';skills.forEach(function(s,i){var hay=JSON.stringify(s).toLowerCase(),ok=(!kw||hay.indexOf(kw)>-1)&&(cat==='全部'||s.category===cat);if(!ok)return;html+='<div class="row '+(i===current?'active':'')+'" data-i="'+i+'"><strong>'+esc(s.name)+'</strong><div class="meta"><span class="pill">'+esc(s.category)+'</span><span class="pill '+(s.enabled!==false?'on':'off')+'">'+(s.enabled!==false?'已启用':'已停用')+'</span><span class="pill">'+(s.featured?'精选':'普通')+'</span><span class="pill">排序 '+esc(s.sort)+'</span></div></div>'});var el=document.getElementById('list');if(el)el.innerHTML=html||'<div class="empty">没有匹配结果</div>';document.querySelectorAll('.row[data-i]').forEach(function(r){r.onclick=function(){current=Number(r.dataset.i);render()}})}
    function field(k,label,type){var s=selected();if(type==='textarea')return '<label class="full">'+label+'<textarea data-k="'+k+'">'+esc(s[k])+'</textarea></label>';if(type==='check')return '<label><input type="checkbox" data-k="'+k+'" '+(s[k]?'checked':'')+'> '+label+'</label>';return '<label '+(k==='github'||k==='path'?'class="full"':'')+'>'+label+'<input data-k="'+k+'" value="'+esc(s[k])+'"></label>'}
    function renderPreview(){var s=selected(),el=document.getElementById('preview');if(!el)return;if(!s){el.innerHTML='';return}el.innerHTML='<div class="card-preview"><div class="num">'+String(s.sort||0).padStart(2,'0')+'</div><span>'+esc(s.tagZh)+'</span><h3>'+esc(s.name)+'</h3><p>'+esc(s.descriptionZh)+'</p><p class="fit">适合：'+esc(s.fitZh)+'</p><div class="mockbtns"><i>一键复制</i><i>打开查看</i><i>GitHub 原版</i></div></div>'}
    function skillView(){return top('技能管理','搜索、筛选、编辑、预览 Skill。当前版本先支持安全导出 JSON。')+'<section class="work"><div class="panel"><h2>Skill 列表</h2><div class="toolbar"><input id="kw" placeholder="搜索名称、分类、用途"><select id="cat"><option>全部</option><option>总结</option><option>前端</option><option>设计</option><option>MCP</option><option>测试</option><option>品牌</option></select></div><div class="actions" style="margin-bottom:12px"><button class="btn primary" id="add" type="button">+ 添加技能</button><button class="btn danger" id="remove" type="button">删除当前</button></div><div class="list" id="list"></div></div><div class="panel"><h2>编辑技能</h2><div class="form" id="form"></div></div><aside class="preview"><h2>实时预览</h2><div id="preview"></div><p class="note">这里的预览会跟随表单实时变化，方便你看前台卡片效果。</p></aside></section>'}
    function renderForm(){var s=selected(),el=document.getElementById('form');if(!el)return;if(!s){el.innerHTML='暂无数据';return}el.innerHTML=field('name','技能名称')+field('category','分类')+field('tagZh','中文标签')+field('tagEn','英文标签')+field('descriptionZh','中文简介','textarea')+field('descriptionEn','英文简介','textarea')+field('fitZh','适合任务','textarea')+field('fitEn','英文适合任务','textarea')+field('path','本站规则链接')+field('github','GitHub 原版链接')+field('sort','排序')+'<div class="checks full">'+field('featured','设为精选','check')+field('enabled','启用','check')+'</div>';document.querySelectorAll('[data-k]').forEach(function(el){el.oninput=el.onchange=function(){var s=selected(),k=el.dataset.k;if(el.type==='checkbox')s[k]=el.checked;else if(k==='sort')s[k]=Number(el.value)||0;else s[k]=el.value;renderList();renderPreview()}})}
    function categories(){var c=counts().cats;var html=Object.keys(c).map(function(k){return '<div class="cat-card"><b>'+esc(k)+'</b><p>'+c[k]+' 个 Skill</p><div class="bar"><i style="width:'+Math.max(8,Math.round(c[k]/skills.length*100))+'%"></i></div></div>'}).join('');return top('分类管理','查看当前分类数量。后续可以增加分类新增、改名、合并功能。')+'<section class="cat-grid">'+html+'</section><section class="notice" style="margin-top:16px">建议固定分类：总结、前端、设计、MCP、测试、品牌。不要太多，否则小白更难选。</section>'}
    function statsView(){var c=counts().cats;var rows=Object.keys(c).map(function(k){var pct=skills.length?Math.round(c[k]/skills.length*100):0;return '<tr><td>'+esc(k)+'</td><td>'+c[k]+'</td><td><div class="bar"><i style="width:'+pct+'%"></i></div></td><td>'+pct+'%</td></tr>'}).join('');var top5=skills.slice().sort(function(a,b){return (a.sort||0)-(b.sort||0)}).slice(0,5).map(function(s,i){return '<tr><td>'+(i+1)+'</td><td>'+esc(s.name)+'</td><td>'+esc(s.category)+'</td><td>'+(s.featured?'精选':'普通')+'</td></tr>'}).join('');return top('数据统计','当前是静态统计。后续接入接口后，可以统计复制次数和访问量。')+statsCards()+'<section class="work" style="grid-template-columns:1fr 1fr;margin-top:16px"><div class="panel"><h2>分类占比</h2><table class="table"><tbody>'+rows+'</tbody></table></div><div class="panel"><h2>Skill 排名预览</h2><table class="table"><tbody>'+top5+'</tbody></table></div></section>'}
    function settings(){return top('系统设置','管理发布方式、GitHub Token 接入计划和安全提示。')+'<section class="work" style="grid-template-columns:1fr 1fr"><div class="panel"><h2>当前发布方式</h2><p class="note">现在是安全静态版：后台编辑 → 保存草稿 → 导出 skills.json → 替换仓库文件。前台会读取仓库里的 skills.json。</p><button class="btn primary" id="downloadJson2" type="button">导出当前 JSON</button></div><div class="panel"><h2>一键发布计划</h2><p class="note">下一步创建 /api/save-skills，并在 Vercel 环境变量配置 GITHUB_TOKEN 和 ADMIN_PASSWORD。配置后后台点击保存，就能写回 GitHub，前台自动更新。</p><button class="btn ghost" disabled type="button">一键发布暂未开启</button></div></section><section class="notice" style="margin-top:16px">安全提醒：公开网页里的 JavaScript 所有人都能看到，所以 GitHub Token 必须放在服务端或 Vercel 环境变量中。</section>'}
    function addSkill(){skills.push({id:'new-skill-'+Date.now(),name:'新技能',category:'前端',tagZh:'标签',tagEn:'Tag',featured:false,enabled:true,path:'new-skill.txt',github:'https://github.com/',descriptionZh:'这里填写技能简介。',descriptionEn:'Skill description.',fitZh:'适合任务',fitEn:'Best for',sort:skills.length+1});current=skills.length-1;render();toast('已添加新技能')}
    function removeSkill(){if(!skills.length)return;if(confirm('确定删除当前技能吗？')){skills.splice(current,1);current=Math.max(0,current-1);render();toast('已删除')}}
    function json(){return JSON.stringify(skills,null,2)}
    function download(){var blob=new Blob([json()],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='skills.json';a.click();URL.revokeObjectURL(a.href);toast('已导出 skills.json')}
    function copyJson(){if(navigator.clipboard)navigator.clipboard.writeText(json()).then(function(){toast('JSON 已复制')}).catch(download);else download()}
    function saveDraft(){localStorage.setItem('skillhub-admin-draft',json());toast('草稿已保存在浏览器')}
    function bindCommon(){document.getElementById('saveDraft')&&(document.getElementById('saveDraft').onclick=saveDraft);document.getElementById('copyJson')&&(document.getElementById('copyJson').onclick=copyJson);document.getElementById('downloadJson')&&(document.getElementById('downloadJson').onclick=download);document.getElementById('downloadJson2')&&(document.getElementById('downloadJson2').onclick=download);document.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){view=b.dataset.go;render()}})}
    function render(){document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('active',b.dataset.view===view)});var main=document.getElementById('main');if(view==='dashboard')main.innerHTML=dashboard();if(view==='skills')main.innerHTML=skillView();if(view==='categories')main.innerHTML=categories();if(view==='stats')main.innerHTML=statsView();if(view==='settings')main.innerHTML=settings();bindCommon();if(view==='skills'){renderList();renderForm();renderPreview();document.getElementById('add').onclick=addSkill;document.getElementById('remove').onclick=removeSkill;document.getElementById('kw').oninput=renderList;document.getElementById('cat').onchange=renderList}}
    document.querySelectorAll('#nav button').forEach(function(b){b.onclick=function(){view=b.dataset.view;render()}});
    render();
    fetch('skills.json?ts='+Date.now()).then(function(r){if(!r.ok)throw new Error('skills.json '+r.status);return r.json()}).then(function(data){var draft=localStorage.getItem('skillhub-admin-draft');skills=draft?JSON.parse(draft):(Array.isArray(data)?data:fallbackSkills.slice());sourceState=draft?'已读取浏览器草稿':'已连接 skills.json';render();if(draft)toast('已读取浏览器草稿')}).catch(function(err){sourceState='读取 skills.json 失败，正在使用内置备用数据';skills=fallbackSkills.slice();render();toast('skills.json 读取失败，已显示备用数据')});
  </script>
</body>
</html>
