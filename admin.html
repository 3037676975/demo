<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SkillHub Admin</title>
  <style>
    :root{--ink:#0f172a;--muted:#64748b;--glass:rgba(255,255,255,.72);--line:rgba(255,255,255,.58);--dark:#0b1224;--blue:#635bff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 12% 10%,#273a8a 0,#0b1224 34%,transparent 35%),radial-gradient(circle at 88% 0,#7dd3fc55,transparent 28%),linear-gradient(135deg,#08111f,#111827 45%,#172554);overflow-x:hidden}
    .app{display:grid;grid-template-columns:250px 1fr;min-height:100vh;padding:18px;gap:18px}.side{border:1px solid rgba(255,255,255,.14);border-radius:28px;background:rgba(8,15,32,.72);backdrop-filter:blur(24px);color:white;padding:18px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;margin:8px 4px 26px}.brand i{width:30px;height:30px;border-radius:12px;background:linear-gradient(135deg,#6366f1,#7dd3fc);box-shadow:0 10px 30px #6366f155}.brand b{font-size:17px}.nav button,.user{width:100%;display:flex;align-items:center;gap:10px;border:0;border-radius:16px;padding:13px 14px;margin:4px 0;background:transparent;color:#cbd5e1;text-align:left;cursor:pointer}.nav button.active{background:rgba(99,102,241,.26);color:#fff}.user{margin-top:auto;background:rgba(255,255,255,.08)}.main{border:1px solid var(--line);border-radius:32px;background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(239,246,255,.75));backdrop-filter:blur(28px) saturate(150%);box-shadow:0 30px 100px rgba(0,0,0,.28);padding:24px;overflow:hidden}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.top h1{margin:0;font-size:28px}.top p{margin:6px 0 0;color:var(--muted)}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.65);border-radius:14px;padding:10px 14px;cursor:pointer;color:#111827}.btn.primary{border:0;background:linear-gradient(135deg,#111827,#334155);color:white;box-shadow:0 14px 34px rgba(15,23,42,.24)}.btn.danger{color:#ef4444}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.stat,.panel,.preview{border:1px solid rgba(255,255,255,.68);border-radius:24px;background:rgba(255,255,255,.52);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 18px 60px rgba(51,65,85,.10)}.stat{padding:18px}.stat span{color:var(--muted);font-size:13px}.stat b{display:block;font-size:30px;margin-top:8px}.work{display:grid;grid-template-columns:1.05fr 1.25fr .85fr;gap:16px;align-items:start}.panel{padding:16px}.panel h2{font-size:18px;margin:0 0 14px}.search{display:grid;grid-template-columns:1fr 130px;gap:10px;margin-bottom:12px}input,select,textarea{width:100%;border:1px solid rgba(148,163,184,.35);border-radius:14px;padding:11px 12px;background:rgba(255,255,255,.72);color:#0f172a;outline:none}textarea{min-height:78px;resize:vertical}.list{display:grid;gap:8px;max-height:640px;overflow:auto;padding-right:2px}.row{border:1px solid rgba(255,255,255,.58);background:rgba(255,255,255,.42);border-radius:16px;padding:12px;cursor:pointer}.row.active{background:#eef2ff;border-color:#818cf8}.row strong{display:block}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;color:#64748b;font-size:12px}.pill{display:inline-flex;border-radius:999px;padding:4px 8px;background:#fff;border:1px solid rgba(148,163,184,.25)}.pill.on{background:#dcfce7;color:#166534}.pill.off{background:#fee2e2;color:#991b1b}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{font-size:13px;color:#475569;font-weight:700}.form .full{grid-column:1/-1}.checks{display:flex;gap:18px;align-items:center;margin-top:4px}.checks label{display:flex;align-items:center;gap:8px}.preview{padding:20px}.card{position:relative;border:1px solid rgba(255,255,255,.72);border-radius:26px;background:rgba(255,255,255,.52);padding:22px;min-height:270px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 24px 80px rgba(51,65,85,.12)}.card .num{color:#94a3b8;font-size:13px;margin-bottom:18px}.card span{display:inline-block;margin-bottom:14px;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.8);font-size:13px}.card h3{margin:0 0 10px}.card p{color:#64748b;line-height:1.7}.card .fit{font-size:13px;color:#475569;background:rgba(255,255,255,.5);border-radius:16px;padding:10px}.card .mockbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.card .mockbtns i{font-style:normal;border-radius:13px;padding:9px 11px;background:#fff;border:1px solid #e2e8f0;font-size:13px}.card .mockbtns i:first-child{background:#111827;color:white}.note{margin-top:16px;color:#64748b;font-size:13px;line-height:1.7}.toast{position:fixed;right:24px;bottom:24px;opacity:0;transform:translateY(10px);transition:.2s;border-radius:18px;padding:12px 16px;background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.8);box-shadow:0 20px 70px rgba(0,0,0,.25);font-weight:700}.toast.show{opacity:1;transform:translateY(0)}
    @media(max-width:1100px){.app{grid-template-columns:1fr}.side{display:block}.work,.stats{grid-template-columns:1fr}.form{grid-template-columns:1fr}.search{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand"><i></i><b>SkillHub Admin</b></div>
      <nav class="nav">
        <button class="active" type="button">总览</button>
        <button type="button">技能管理</button>
        <button type="button">分类管理</button>
        <button type="button">数据统计</button>
        <button type="button">系统设置</button>
      </nav>
      <div class="user">👤 Admin<br><small>管理员</small></div>
    </aside>
    <main class="main">
      <section class="top">
        <div><h1>技能管理后台</h1><p>可视化维护 Skill 数据，导出 skills.json 后即可接入前台。</p></div>
        <div class="actions">
          <a class="btn" href="index.html">打开前台</a>
          <button class="btn" id="saveDraft" type="button">保存草稿</button>
          <button class="btn" id="copyJson" type="button">复制 JSON</button>
          <button class="btn primary" id="downloadJson" type="button">导出 skills.json</button>
        </div>
      </section>
      <section class="stats" id="stats"></section>
      <section class="work">
        <div class="panel">
          <h2>Skill 列表</h2>
          <div class="search"><input id="kw" placeholder="搜索名称、分类、用途"><select id="cat"><option>全部</option><option>总结</option><option>前端</option><option>设计</option><option>MCP</option><option>测试</option><option>品牌</option></select></div>
          <div class="actions" style="margin-bottom:12px"><button class="btn primary" id="add" type="button">+ 添加技能</button><button class="btn danger" id="remove" type="button">删除当前</button></div>
          <div class="list" id="list"></div>
        </div>
        <div class="panel">
          <h2>编辑技能</h2>
          <div class="form" id="form"></div>
        </div>
        <aside class="preview">
          <h2>实时预览</h2>
          <div id="preview"></div>
          <p class="note">当前版本为安全管理台：可以编辑、预览、保存草稿、导出 JSON。真正一键发布到 GitHub 需要后续配置服务器端 Token，不能把密钥写在前端页面里。</p>
        </aside>
      </section>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    var skills=[],current=0;
    function toast(t){var el=document.getElementById('toast');el.textContent=t;el.className='toast show';setTimeout(function(){el.className='toast'},1800)}
    function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
    function selected(){return skills[current]||skills[0]}
    function renderStats(){var on=skills.filter(function(s){return s.enabled!==false}).length,hot=skills.filter(function(s){return s.featured}).length,cats=new Set(skills.map(function(s){return s.category}));document.getElementById('stats').innerHTML='<div class="stat"><span>技能总数</span><b>'+skills.length+'</b></div><div class="stat"><span>精选技能</span><b>'+hot+'</b></div><div class="stat"><span>分类数量</span><b>'+cats.size+'</b></div><div class="stat"><span>已启用</span><b>'+on+'</b></div>'}
    function renderList(){var kw=document.getElementById('kw')?document.getElementById('kw').value.toLowerCase():'',cat=document.getElementById('cat')?document.getElementById('cat').value:'全部';var html='';skills.forEach(function(s,i){var hay=JSON.stringify(s).toLowerCase(),ok=(!kw||hay.indexOf(kw)>-1)&&(cat==='全部'||s.category===cat);if(!ok)return;html+='<div class="row '+(i===current?'active':'')+'" data-i="'+i+'"><strong>'+esc(s.name)+'</strong><div class="meta"><span class="pill">'+esc(s.category)+'</span><span class="pill '+(s.enabled!==false?'on':'off')+'">'+(s.enabled!==false?'已启用':'已停用')+'</span><span class="pill">'+(s.featured?'精选':'普通')+'</span><span class="pill">排序 '+esc(s.sort)+'</span></div></div>'});document.getElementById('list').innerHTML=html||'<div class="row">没有匹配结果</div>';document.querySelectorAll('.row[data-i]').forEach(function(r){r.onclick=function(){current=Number(r.dataset.i);render()}})}
    function field(k,label,type){var s=selected();if(type==='textarea')return '<label class="full">'+label+'<textarea data-k="'+k+'">'+esc(s[k])+'</textarea></label>';if(type==='check')return '<label><input type="checkbox" data-k="'+k+'" '+(s[k]?'checked':'')+'> '+label+'</label>';return '<label '+(k==='github'||k==='path'?'class="full"':'')+'>'+label+'<input data-k="'+k+'" value="'+esc(s[k])+'"></label>'}
    function renderForm(){var s=selected();if(!s){document.getElementById('form').innerHTML='暂无数据';return}document.getElementById('form').innerHTML=field('name','技能名称')+field('category','分类')+field('tagZh','中文标签')+field('tagEn','英文标签')+field('descriptionZh','中文简介','textarea')+field('descriptionEn','英文简介','textarea')+field('fitZh','适合任务','textarea')+field('fitEn','英文适合任务','textarea')+field('path','本站规则链接')+field('github','GitHub 原版链接')+field('sort','排序')+'<div class="checks full">'+field('featured','设为精选','check')+field('enabled','启用','check')+'</div>';document.querySelectorAll('[data-k]').forEach(function(el){el.oninput=el.onchange=function(){var k=el.dataset.k;if(el.type==='checkbox')s[k]=el.checked;else if(k==='sort')s[k]=Number(el.value)||0;else s[k]=el.value;renderStats();renderList();renderPreview()}})}
    function renderPreview(){var s=selected();if(!s){document.getElementById('preview').innerHTML='';return}document.getElementById('preview').innerHTML='<div class="card"><div class="num">'+String(s.sort||0).padStart(2,'0')+'</div><span>'+esc(s.tagZh)+'</span><h3>'+esc(s.name)+'</h3><p>'+esc(s.descriptionZh)+'</p><p class="fit">适合：'+esc(s.fitZh)+'</p><div class="mockbtns"><i>一键复制</i><i>打开查看</i><i>GitHub 原版</i></div></div>'}
    function render(){renderStats();renderList();renderForm();renderPreview()}
    function addSkill(){skills.push({id:'new-skill-'+Date.now(),name:'新技能',category:'前端',tagZh:'标签',tagEn:'Tag',featured:false,enabled:true,path:'new-skill.txt',github:'https://github.com/',descriptionZh:'这里填写技能简介。',descriptionEn:'Skill description.',fitZh:'适合任务',fitEn:'Best for',sort:skills.length+1});current=skills.length-1;render();toast('已添加新技能')}
    function removeSkill(){if(!skills.length)return;if(confirm('确定删除当前技能吗？')){skills.splice(current,1);current=Math.max(0,current-1);render();toast('已删除')}}
    function json(){return JSON.stringify(skills,null,2)}
    function download(){var blob=new Blob([json()],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='skills.json';a.click();URL.revokeObjectURL(a.href);toast('已导出 skills.json')}
    function copyJson(){navigator.clipboard&&navigator.clipboard.writeText(json()).then(function(){toast('JSON 已复制')}).catch(download)}
    function saveDraft(){localStorage.setItem('skillhub-admin-draft',json());toast('草稿已保存在浏览器')}
    document.getElementById('add').onclick=addSkill;document.getElementById('remove').onclick=removeSkill;document.getElementById('downloadJson').onclick=download;document.getElementById('copyJson').onclick=copyJson;document.getElementById('saveDraft').onclick=saveDraft;document.getElementById('kw').oninput=renderList;document.getElementById('cat').onchange=renderList;
    fetch('skills.json?ts='+Date.now()).then(function(r){return r.json()}).then(function(data){var draft=localStorage.getItem('skillhub-admin-draft');skills=draft?JSON.parse(draft):data;render();if(draft)toast('已读取浏览器草稿')}).catch(function(){skills=[];render();toast('读取 skills.json 失败')});
  </script>
</body>
</html>
