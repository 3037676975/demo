<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SkillHub Admin</title>
  <script>
    if(!sessionStorage.getItem('skillhub-admin-token')){
      location.replace('login.html');
    }
  </script>
  <style>
    :root{--ink:#0f172a;--muted:#64748b;--panel:rgba(255,255,255,.58);--line:rgba(255,255,255,.62);--accent:#635bff;--cyan:#7dd3fc;--bad:#ef4444}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 8%,#263b8f 0,#0b1224 32%,transparent 33%),radial-gradient(circle at 88% 4%,rgba(125,211,252,.34),transparent 28%),linear-gradient(135deg,#08111f,#111827 45%,#172554);overflow-x:hidden}.app{display:grid;grid-template-columns:260px 1fr;gap:18px;min-height:100vh;padding:18px}.side{position:sticky;top:18px;height:calc(100vh - 36px);display:flex;flex-direction:column;padding:18px;border:1px solid rgba(255,255,255,.14);border-radius:30px;background:rgba(8,15,32,.74);backdrop-filter:blur(28px) saturate(150%);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 28px 90px rgba(0,0,0,.24);color:white}.brand{display:flex;align-items:center;gap:10px;margin:8px 4px 26px}.brand i{width:32px;height:32px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--cyan));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 12px 32px rgba(99,102,241,.42)}.brand b{font-size:18px}.nav{display:grid;gap:8px}.nav button,.nav a{width:100%;border:1px solid transparent;border-radius:17px;padding:13px 14px;background:transparent;color:#cbd5e1;text-align:left;cursor:pointer;font-weight:800;transition:.18s;text-decoration:none;font-size:14px}.nav button:hover,.nav a:hover{background:rgba(255,255,255,.08);transform:translateX(2px)}.nav button.active{background:linear-gradient(135deg,rgba(99,102,241,.34),rgba(125,211,252,.12));border-color:rgba(255,255,255,.12);color:white}.nav a.import{background:linear-gradient(135deg,rgba(34,197,94,.28),rgba(125,211,252,.12));border-color:rgba(255,255,255,.14);color:white}.user{margin-top:auto;border-radius:18px;background:rgba(255,255,255,.08);padding:14px;color:#e2e8f0}.logout{margin-top:10px;width:100%;border:1px solid rgba(255,255,255,.18);border-radius:14px;background:rgba(255,255,255,.08);color:white;padding:9px 10px;font-weight:800;cursor:pointer}.main{min-width:0;border:1px solid var(--line);border-radius:34px;background:linear-gradient(135deg,rgba(255,255,255,.93),rgba(239,246,255,.74));backdrop-filter:blur(28px) saturate(155%);box-shadow:0 30px 100px rgba(0,0,0,.28);padding:24px;overflow:hidden}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.top h1{margin:0;font-size:30px;letter-spacing:-.8px}.top p{margin:7px 0 0;color:var(--muted);line-height:1.65}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid rgba(255,255,255,.72);border-radius:15px;padding:10px 14px;background:rgba(255,255,255,.64);color:#111827;text-decoration:none;cursor:pointer;font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.75)}.btn.primary{border:0;background:linear-gradient(135deg,#111827,#334155);color:white;box-shadow:0 14px 34px rgba(15,23,42,.24)}.btn.publish{border:0;background:linear-gradient(135deg,var(--accent),#334155);color:white}.btn.danger{color:var(--bad)}.pass{width:160px;border:1px solid rgba(148,163,184,.35);border-radius:15px;padding:10px 12px;background:rgba(255,255,255,.66)}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric,.panel,.preview,.notice{position:relative;border:1px solid rgba(255,255,255,.68);border-radius:26px;background:var(--panel);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 18px 60px rgba(51,65,85,.10);overflow:hidden}.metric:after,.panel:after,.preview:after{content:"";position:absolute;inset:1px;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.6),transparent 38%,rgba(255,255,255,.2));pointer-events:none}.metric{padding:18px}.metric span,.label{color:var(--muted);font-size:13px;font-weight:800}.metric b{display:block;font-size:32px;margin-top:8px}.work{display:grid;grid-template-columns:1.03fr 1.28fr .9fr;gap:16px;align-items:start;margin-top:16px}.work.two{grid-template-columns:1.2fr .8fr}.panel,.preview{padding:18px}.panel>* ,.preview>* ,.metric>*{position:relative;z-index:1}.panel h2,.preview h2{font-size:18px;margin:0 0 14px}.toolbar{display:grid;grid-template-columns:1fr 132px;gap:10px;margin-bottom:12px}input,select,textarea{width:100%;border:1px solid rgba(148,163,184,.35);border-radius:15px;padding:12px 13px;background:rgba(255,255,255,.72);color:#0f172a;outline:none}textarea{min-height:80px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:rgba(99,102,241,.45);box-shadow:0 0 0 4px rgba(99,102,241,.1)}.list{display:grid;gap:8px;max-height:640px;overflow:auto;padding-right:2px}.row{border:1px solid rgba(255,255,255,.58);background:rgba(255,255,255,.42);border-radius:17px;padding:12px;cursor:pointer}.row.active{background:#eef2ff;border-color:#818cf8}.row strong{display:block}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;color:#64748b;font-size:12px}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;background:#fff;border:1px solid rgba(148,163,184,.25)}.pill.on{background:#dcfce7;color:#166534}.pill.off{background:#fee2e2;color:#991b1b}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{font-size:13px;color:#475569;font-weight:800}.form .full{grid-column:1/-1}.checks{display:flex;gap:18px;align-items:center}.checks label{display:flex;align-items:center;gap:8px}.card-preview{border:1px solid rgba(255,255,255,.72);border-radius:28px;background:rgba(255,255,255,.52);padding:22px;min-height:270px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 24px 80px rgba(51,65,85,.12)}.card-preview .num{color:#94a3b8;font-size:13px;margin-bottom:18px}.card-preview span{display:inline-block;margin-bottom:14px;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.8);font-size:13px}.card-preview h3{margin:0 0 10px}.card-preview p{color:#64748b;line-height:1.7}.fit{font-size:13px;color:#475569;background:rgba(255,255,255,.5);border-radius:16px;padding:10px}.mockbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.mockbtns i{font-style:normal;border-radius:13px;padding:9px 11px;background:#fff;border:1px solid #e2e8f0;font-size:13px}.mockbtns i:first-child{background:#111827;color:white}.note,.notice{padding:16px;color:#64748b;font-size:13px;line-height:1.7}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid rgba(148,163,184,.2);text-align:left}.table th{color:#64748b;font-size:13px}.bar{height:10px;border-radius:999px;background:#e2e8f0;overflow:hidden}.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--cyan))}.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.cat-card{border:1px solid rgba(255,255,255,.68);border-radius:24px;background:rgba(255,255,255,.48);padding:18px}.cat-card b{font-size:20px}.cat-card p{margin:8px 0 0;color:#64748b}.empty{padding:28px;text-align:center;color:#64748b;font-weight:800}.small-actions{margin-bottom:12px}.toast{position:fixed;right:24px;bottom:24px;z-index:40;opacity:0;transform:translateY(10px);transition:.2s;border-radius:18px;padding:12px 16px;background:rgba(255,255,255,.84);border:1px solid rgba(255,255,255,.8);backdrop-filter:blur(20px);box-shadow:0 20px 70px rgba(0,0,0,.25);font-weight:800}.toast.show{opacity:1;transform:translateY(0)}@media(max-width:1180px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.nav{grid-template-columns:repeat(5,1fr)}.top{display:block}.work,.work.two,.grid4,.cat-grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand"><i></i><b>SkillHub Admin</b></div>
      <nav class="nav" id="nav">
        <button class="active" data-view="dashboard" type="button">总览 Dashboard</button>
        <button data-view="skills" type="button">技能管理</button>
        <a class="import" href="import-save.html">+ 导入 GitHub Skill</a>
        <button data-view="categories" type="button">分类管理</button>
        <button data-view="stats" type="button">数据统计</button>
        <button data-view="settings" type="button">系统设置</button>
      </nav>
      <div class="user">👤 Admin<br><small>管理员 · Supabase 发布版</small><button class="logout" id="logout" type="button">退出登录</button></div>
    </aside>
    <main class="main" id="main">
      <section class="top">
        <div>
          <h1>管理后台 · 总览</h1>
          <p>后台正在启动，如果一直停留在这里，请强制刷新页面。</p>
        </div>
      </section>
      <section class="grid4">
        <div class="metric"><span>状态</span><b>Loading</b></div>
        <div class="metric"><span>提示</span><b>JS</b></div>
        <div class="metric"><span>数据</span><b>DB</b></div>
        <div class="metric"><span>发布</span><b>API</b></div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    document.getElementById('logout').onclick=function(){sessionStorage.removeItem('skillhub-admin-token');location.href='login.html'};
  </script>
  <script src="admin.js?v=20260628-7" defer></script>
</body>
</html>
