<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillHub Import</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at 12% 6%,rgba(99,102,241,.2),transparent 28%),radial-gradient(circle at 82% 12%,rgba(56,189,248,.18),transparent 30%),linear-gradient(135deg,#eef2ff,#fff);color:#0f172a;overflow-x:hidden}body:before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(circle at 30% 40%,rgba(168,85,247,.16),transparent 28%),radial-gradient(circle at 70% 65%,rgba(14,165,233,.14),transparent 30%);filter:blur(18px);animation:floatBg 15s ease-in-out infinite alternate}main{max-width:1100px;margin:0 auto;padding:34px}.box,.card{background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.9);border-radius:28px;padding:24px;margin:14px 0;box-shadow:0 28px 80px rgba(15,23,42,.12);backdrop-filter:blur(20px);animation:riseIn .48s cubic-bezier(.2,.8,.2,1) both}h1{margin:0 0 10px;font-size:34px}h2{margin:0 0 14px}.tip{background:#f8fafc;border:1px solid #e2e8f0;border-radius:18px;padding:14px;color:#475569;line-height:1.8}input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:16px;margin:8px 0;font-size:15px;transition:.2s}input:focus{outline:none;border-color:#818cf8;box-shadow:0 0 0 5px rgba(99,102,241,.12)}button,a{display:inline-flex;align-items:center;justify-content:center;margin:8px 8px 0 0;padding:12px 16px;border-radius:16px;background:#111827;color:white;border:0;text-decoration:none;font-weight:850;cursor:pointer;transition:transform .18s,box-shadow .18s,background .18s}button:hover,a:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(15,23,42,.16)}.ghost{background:#fff;color:#111827;border:1px solid #cbd5e1}.ok{background:#16a34a}.muted{color:#64748b}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:#f8fafc;border:1px solid #e2e8f0;border-radius:18px;padding:14px;animation:popIn .34s cubic-bezier(.2,.8,.2,1) both}.metric span{font-size:12px;color:#64748b;font-weight:800}.metric b{display:block;margin-top:8px;font-size:17px}.preview{display:grid;grid-template-columns:1fr 1fr;gap:14px}.pill{display:inline-block;border-radius:999px;padding:6px 10px;background:#e0f2fe;color:#0369a1;font-size:13px;font-weight:800}.warn{background:#fff7ed;border-color:#fed7aa}.pass{background:#f0fdf4;border-color:#bbf7d0}.link{word-break:break-all;font-size:13px;color:#334155;background:#f8fafc;border-radius:14px;padding:10px}pre{white-space:pre-wrap;background:#0f172a;color:#e2e8f0;border-radius:18px;padding:16px;overflow:auto}.hide{display:none}.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.step{position:relative;border:1px solid #e2e8f0;border-radius:18px;background:#f8fafc;padding:13px 12px;color:#64748b;font-weight:850;overflow:hidden}.step:before{content:"";display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:999px;background:#e2e8f0;color:#475569;margin-right:8px;vertical-align:middle}.step:nth-child(1):before{content:"1"}.step:nth-child(2):before{content:"2"}.step:nth-child(3):before{content:"3"}.step:nth-child(4):before{content:"4"}.step.done{background:#f0fdf4;border-color:#bbf7d0;color:#166534}.step.done:before{content:"✓";background:#16a34a;color:white}.step.active{background:#eef2ff;border-color:#818cf8;color:#3730a3;box-shadow:0 12px 34px rgba(99,102,241,.12)}.step.active:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:sweep 1.2s ease infinite}.step.error{background:#fef2f2;border-color:#fecaca;color:#991b1b}.step.error:before{content:"!";background:#dc2626;color:white}.report-show{animation:riseIn .48s cubic-bezier(.2,.8,.2,1) both}@keyframes floatBg{from{transform:translate3d(-1%,0,0) rotate(0deg)}to{transform:translate3d(2%,2%,0) rotate(5deg)}}@keyframes riseIn{from{opacity:0;transform:translateY(18px) scale(.985);filter:blur(4px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}@media(max-width:900px){.grid,.preview,.stepper{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<section class="box">
<h1>导入 GitHub Skill 调用入口</h1>
<p class="tip">现在是产品式导入流程：粘贴链接 → 分析规则 → 预览报告 → 确认保存。系统会自动寻找 SKILL.md / CLAUDE.md / AGENTS.md / README.md，并固定到当前 commit 版本。</p>
<div class="stepper" id="stepper"><div class="step active">粘贴链接</div><div class="step">分析规则</div><div class="step">预览报告</div><div class="step">确认保存</div></div>
<input id="url" placeholder="GitHub 仓库主页或 SKILL.md 文件链接，例如 https://github.com/pinchbench/skill">
<input id="pass" type="password" placeholder="ADMIN_PASSWORD，保存时使用">
<button id="analyze">1. 分析预览</button><button class="ok hide" id="save">2. 确认保存</button><a class="ghost" href="admin.html">返回后台</a>
<p id="msg" class="muted"></p>
</section>
<section class="box hide" id="reportBox"><h2>导入报告</h2><div class="grid" id="metrics"></div><div class="preview" style="margin-top:14px"><div class="card" id="card"></div><div class="card" id="checks"></div></div></section>
<section class="box"><h2>原始 JSON</h2><pre id="out">等待分析...</pre></section>
</main>
<script>
let analyzed=null,loadedSkills=[];
const $=id=>document.getElementById(id);
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setMsg(t){$('msg').textContent=t}
function setStep(n,state){document.querySelectorAll('.step').forEach((el,i)=>{el.className='step';if(i<n-1)el.classList.add('done');if(i===n-1)el.classList.add(state||'active')})}
function metric(k,v){return `<div class="metric"><span>${esc(k)}</span><b>${esc(v)}</b></div>`}
async function loadSkills(){const r=await fetch('/api/skills?ts='+Date.now());const d=await r.json();return Array.isArray(d.skills)?d.skills:[]}
function renderReport(d){const s=d.skill,r=d.report||{};$('reportBox').classList.remove('hide');$('reportBox').classList.remove('report-show');void $('reportBox').offsetWidth;$('reportBox').classList.add('report-show');$('save').classList.remove('hide');$('metrics').innerHTML=metric('识别文件',r.selectedFile||'-')+metric('固定版本',d.pinnedRef?'已锁定':'未锁定')+metric('依赖提醒',r.hasPossibleDependencies?'可能有依赖':'未发现明显依赖')+metric('导入方式',r.inputType||d.source||'-');$('card').innerHTML=`<p><span class="pill">${esc(s.category)}</span> <span class="pill">${esc(s.tagZh)}</span></p><h2>${esc(s.name)}</h2><p>${esc(s.descriptionZh)}</p><p class="muted"><b>适合：</b>${esc(s.fitZh)}</p><p class="link">规则链接：${esc(s.path)}</p><p class="link">GitHub：${esc(s.github)}</p>`;$('checks').className='card '+(r.hasPossibleDependencies||r.hasReferences?'warn':'pass');$('checks').innerHTML=`<h2>可用性检测</h2><p>✅ 规则文件已成功读取</p><p>✅ 已固定到 commit：${esc((d.pinnedRef||'').slice(0,12))}</p><p>${r.hasReferences?'⚠️ 发现可能引用其他文件':'✅ 未发现明显文件引用'}</p><p>${r.hasPossibleDependencies?'⚠️ 发现可能依赖工具/API/环境':'✅ 未发现明显外部依赖'}</p><p class="tip">${esc(r.warning||'')}</p>`;$('out').textContent=JSON.stringify({report:r,pinnedRef:d.pinnedRef,directory:d.directory,skill:s},null,2)}
async function analyze(){try{const url=$('url').value.trim();if(!url){setStep(1,'error');setMsg('请先填写 GitHub 链接');return}setStep(2,'active');setMsg('正在分析仓库和规则入口...');$('save').classList.add('hide');const r=await fetch('/api/import-github-skill',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.message||'识别失败');analyzed=d;loadedSkills=await loadSkills();const exists=loadedSkills.some(x=>x.id===d.skill.id);setStep(3,'active');setMsg(exists?'分析完成：检测到同名 Skill，确认保存会更新它。':'分析完成：请确认卡片信息，没问题再保存。');renderReport(d)}catch(e){setStep(2,'error');setMsg('分析失败：'+(e.message||e));$('out').textContent=String(e.message||e)}}
async function save(){try{if(!analyzed){setMsg('请先分析预览');return}const password=$('pass').value;if(!password){setStep(4,'error');setMsg('请填写后台密码再保存');return}setStep(4,'active');let skills=loadedSkills.slice();const skill=analyzed.skill;const i=skills.findIndex(x=>x.id===skill.id);if(i>=0){skill.sort=skills[i].sort||i+1;skills[i]=skill}else{skill.sort=skills.length+1;skills.push(skill)}setMsg(i>=0?'正在更新已有 Skill...':'正在保存新 Skill...');const r=await fetch('/api/save-skills-db',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password,skills})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.message||'保存失败');setStep(5,'done');setMsg(i>=0?'更新成功。前台刷新即可看到最新固定入口。':'保存成功。前台刷新即可看到新 Skill。')}catch(e){setStep(4,'error');setMsg('保存失败：'+(e.message||e))}}
$('analyze').onclick=analyze;$('save').onclick=save;const initial=new URLSearchParams(location.search).get('url');if(initial){$('url').value=initial;analyze()}
</script></body></html>
