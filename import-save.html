<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Import Save</title><style>body{font-family:Arial;margin:0;background:#eef2ff;color:#0f172a}main{max-width:820px;margin:auto;padding:32px}.box{background:white;border-radius:22px;padding:22px;margin:14px 0;box-shadow:0 20px 60px #cbd5e1}input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:14px;margin:8px 0}button,a{display:inline-block;margin:8px 8px 0 0;padding:12px 16px;border-radius:14px;background:#111827;color:white;border:0;text-decoration:none;font-weight:bold}pre{white-space:pre-wrap;background:#111827;color:#e2e8f0;border-radius:16px;padding:14px}</style></head>
<body><main><div class="box"><h1>导入并保存 GitHub Skill</h1><p>填 GitHub 文件链接和后台密码，点一次即可保存到 Supabase。</p><input id="url" placeholder="GitHub SKILL.md 链接"><input id="pass" type="password" placeholder="ADMIN_PASSWORD"><button id="go">导入并保存</button><a href="admin.html">返回后台</a><p id="msg"></p></div><div class="box"><h2>结果</h2><pre id="out">等待操作...</pre></div></main><script>
const $=id=>document.getElementById(id);
async function loadSkills(){const r=await fetch('/api/skills?ts='+Date.now());const d=await r.json();return Array.isArray(d.skills)?d.skills:[]}
$('go').onclick=async()=>{try{const url=$('url').value.trim(),password=$('pass').value;if(!url||!password){$('msg').textContent='请填写链接和后台密码';return}$('msg').textContent='正在识别...';const r=await fetch('/api/import-github-skill',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.message||'识别失败');const skills=await loadSkills();const skill=d.skill;if(skills.some(s=>s.id===skill.id))skill.id=skill.id+'-'+Date.now();skill.sort=skills.length+1;skills.push(skill);$('out').textContent=JSON.stringify(skill,null,2);$('msg').textContent='正在保存...';const s=await fetch('/api/save-skills-db',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password,skills})});const sd=await s.json();if(!s.ok||!sd.ok)throw new Error(sd.message||'保存失败');$('msg').textContent='导入并保存成功，前台刷新即可看到。'}catch(e){$('msg').textContent='失败：'+(e.message||e)}};
</script></body></html>
